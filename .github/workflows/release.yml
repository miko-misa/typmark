name: release-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release view "$RELEASE_TAG" ||
          gh release create "$RELEASE_TAG" --verify-tag --draft
          --title "$RELEASE_TAG" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: >-
          cargo build -p typmark-cli --release --locked
          --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BIN="target/$TARGET/release/typmark-cli"
          NAME="typmark-cli-$RELEASE_TAG-"
          OUT="dist/${NAME}${TARGET}.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$BIN")" "$(basename "$BIN")"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/$env:TARGET/release/typmark-cli.exe"
          $out = "dist/typmark-cli-$env:RELEASE_TAG-"
          $out += $env:TARGET + ".zip"
          Compress-Archive -Path $bin -DestinationPath $out

      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  build-wasm:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: wasm-pack

      - name: Build WASM package
        run: >-
          wasm-pack build crates/typmark-wasm --target web
          --out-dir pkg --locked

      - name: Package WASM (tar.gz)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          OUT="dist/typmark-wasm-$RELEASE_TAG.tar.gz"
          tar -czf "$OUT" -C crates/typmark-wasm/pkg .

      - name: Upload WASM Asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-release:
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
